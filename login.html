<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <meta name="description" content="Sign in or create your BCA HUB student account.">
  <title>Student Login | BCA HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
  <script type="module" src="auth.js?v=4"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="BCA HUB home"><span class="brand-mark">B</span><span>BCA <b>HUB</b></span></a>
  </header>
  <main class="auth-main">
    <section class="auth-card">
      <div class="eyebrow">YOUR BCA HUB ACCOUNT</div>
      <h1>Student <span>account.</span></h1>
      <p class="auth-intro">Sign in to access your BCA HUB student space and learning progress.</p>
      <div id="authStatus" class="auth-status" role="status" aria-live="polite"></div>
      <section id="authForms">
        <div class="auth-tabs" role="tablist" aria-label="Account options">
          <button type="button" class="auth-tab active" id="showLogin" aria-selected="true">Log in</button>
          <button type="button" class="auth-tab" id="showSignup" aria-selected="false">Create account</button>
        </div>
        <form id="loginForm" class="auth-form">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required minlength="8" placeholder="Enter your password">
          <button class="button button-gold auth-submit" type="submit">Log in</button>
          <button class="auth-text-button" id="forgotPassword" type="button">Forgot password?</button>
        </form>
        <form id="signupForm" class="auth-form" hidden>
          <label for="signupName">Display name</label>
          <input id="signupName" type="text" autocomplete="name" maxlength="60" required placeholder="Your name">
          <label for="signupEmail">Email address</label>
          <input id="signupEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <label for="signupPassword">Create password</label>
          <input id="signupPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
          <button class="button button-gold auth-submit" type="submit">Create account</button>
          <p class="auth-small-note">A verification email will be sent before you can sign in.</p>
        </form>
        <form id="recoveryForm" class="auth-form" hidden>
          <label for="recoveryEmail">Account email</label>
          <input id="recoveryEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <button class="button button-gold auth-submit" type="submit">Send password reset email</button>
          <button class="auth-text-button" id="backToLogin" type="button">Back to login</button>
        </form>
        <form id="newPasswordForm" class="auth-form" hidden>
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again">
          <button class="button button-gold auth-submit" type="submit">Update password</button>
        </form>
      </section>
      <section id="accountPanel" hidden>
        <div class="account-welcome"><div class="eyebrow">SIGNED IN</div><h2 id="accountName">Welcome</h2><p id="accountEmail"></p></div>
        <div class="account-actions">
          <a class="button button-gold" href="dashboard.html">Open student dashboard ↗</a>
          <button class="auth-secondary-button" id="logoutButton" type="button">Log out</button>
        </div>
      </section>
    </section>
  </main>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">B</span><span>BCA <b>HUB</b></span></a><span class="copyright">© <span id="year"></span> BCA HUB</span></footer>
</body>
</html>
