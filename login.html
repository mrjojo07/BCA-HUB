<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <link rel="icon" type="image/svg+xml" href="assets/bca-sync-logo.svg?v=3">
  <meta name="description" content="Sign in or create your BCA SYNC student account.">
  <title>Student Login | BCA SYNC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=40">
  <script type="module" src="auth.js?v=12"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="BCA SYNC home"><img class="brand-mark brand-logo" src="assets/bca-sync-logo.svg?v=3" alt="" aria-hidden="true"><span>BCA <b>SYNC</b></span></a>
  </header>
  <main class="auth-main">
    <section class="auth-card">
      <div class="eyebrow">YOUR BCA SYNC ACCOUNT</div>
      <h1>Student <span>account.</span></h1>
      <p class="auth-intro">Sign in to access your BCA SYNC student space and learning progress.</p>
      <div id="authStatus" class="auth-status" role="status" aria-live="polite"></div>
      <section id="authForms">
        <div class="auth-tabs" role="tablist" aria-label="Account options">
          <button type="button" class="auth-tab active" id="showLogin" aria-selected="true">Log in</button>
          <button type="button" class="auth-tab" id="showSignup" aria-selected="false">Create account</button>
        </div>
        <form id="loginForm" class="auth-form">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <label for="loginPassword">Password</label>
          <div class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" required minlength="8" placeholder="Enter your password"><button class="password-toggle" type="button" data-password-target="loginPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <button class="button button-gold auth-submit" type="submit">Log in</button>
          <button class="auth-text-button" id="forgotPassword" type="button">Forgot password?</button>
        </form>
        <form id="signupForm" class="auth-form" hidden>
          <label for="signupName">Display name</label>
          <input id="signupName" type="text" autocomplete="name" maxlength="60" required placeholder="Your name">
          <label for="signupEmail">Email address</label>
          <input id="signupEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <label for="signupPassword">Create password</label>
          <div class="password-field"><input id="signupPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"><button class="password-toggle" type="button" data-password-target="signupPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <button class="button button-gold auth-submit" type="submit">Create account</button>
          <p class="auth-small-note">A 6-digit OTP will be sent to your email to verify your account.</p>
        </form>
        <form id="otpForm" class="auth-form" hidden>
          <p class="auth-small-note">Enter the 6-digit code sent to <strong id="otpEmailLabel"></strong>.</p>
          <label for="signupOtp">Email verification code</label>
          <input id="signupOtp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="6-digit OTP">
          <button class="button button-gold auth-submit" type="submit">Verify email</button>
          <button class="auth-text-button" id="resendSignupOtp" type="button">Resend code</button>
        </form>
        <form id="recoveryForm" class="auth-form" hidden>
          <label for="recoveryEmail">Account email</label>
          <input id="recoveryEmail" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <button class="button button-gold auth-submit" type="submit">Send password reset email</button>
          <button class="auth-text-button" id="backToLogin" type="button">Back to login</button>
        </form>
        <form id="newPasswordForm" class="auth-form" hidden>
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again">
          <button class="button button-gold auth-submit" type="submit">Update password</button>
        </form>
      </section>
      <section id="accountPanel" hidden>
        <div class="account-welcome"><div class="eyebrow">SIGNED IN</div><h2 id="accountName">Welcome</h2><p id="accountEmail"></p></div>
        <div class="account-actions">
          <a class="button button-gold" href="dashboard.html">Open student dashboard ↗</a>
          <button class="auth-secondary-button" id="logoutButton" type="button">Log out</button>
        </div>
      </section>
    </section>
  </main>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><img class="brand-mark brand-logo" src="assets/bca-sync-logo.svg?v=3" alt="" aria-hidden="true"><span>BCA <b>SYNC</b></span></a><span class="copyright">© <span id="year"></span> BCA SYNC</span></footer>
  <script type="module" src="pwa.js?v=1"></script>
</body>
</html>
